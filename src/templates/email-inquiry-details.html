<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <title>New Inquiry</title>
</head>
<body style="margin:0;padding:0;background-color:#f4f6f9;-webkit-text-size-adjust:100%;-ms-text-size-adjust:100%;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#f4f6f9;border-collapse:collapse;">
    <tr>
      <td align="center" style="padding:32px 16px;">
        <table role="presentation" width="600" cellpadding="0" cellspacing="0" border="0" style="max-width:600px;width:100%;background-color:#ffffff;border-collapse:collapse;border:1px solid #e8ecf2;">
          <tr>
            <td style="background-color:#0a1628;padding:20px 32px;text-align:left;">
              <a href="${siteUrl}" target="_blank" style="text-decoration:none;display:inline-block;">
                <img src="${logoUrl}" alt="YTS Enterprise" width="140" height="auto" style="display:block;border:0;outline:none;max-width:140px;height:auto;background-color:#ffffff;padding:8px 12px;">
                <span style="display:block;margin-top:10px;font-family:Arial,Helvetica,sans-serif;font-size:13px;font-weight:700;letter-spacing:0.04em;color:#ffffff;">YTS Enterprise</span>
              </a>
            </td>
          </tr>
          <tr>
            <td style="padding:32px 40px 8px 40px;">
              <h1 style="margin:0;font-family:Arial,Helvetica,sans-serif;font-size:22px;line-height:1.3;font-weight:700;color:#0a1628;">New ${rentalType} inquiry</h1>
              <p style="margin:12px 0 0 0;font-family:Arial,Helvetica,sans-serif;font-size:14px;line-height:1.5;color:#64748b;">Submitted via the website inquiry form.</p>
            </td>
          </tr>
          <tr>
            <td style="padding:16px 40px 40px 40px;">
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="border-collapse:collapse;background-color:#f4f6f9;border:1px solid #e8ecf2;">
                <tr>
                  <td style="padding:20px 24px;font-family:Arial,Helvetica,sans-serif;font-size:14px;line-height:1.7;color:#334155;">
                    <p style="margin:0 0 10px 0;"><strong style="color:#0a1628;">Rental type:</strong> ${rentalType}</p>
                    <p style="margin:0 0 10px 0;"><strong style="color:#0a1628;">Rental:</strong> ${rentalDetails}</p>
                    <p style="margin:0 0 10px 0;"><strong style="color:#0a1628;">Name:</strong> ${name}</p>
                    <p style="margin:0 0 10px 0;"><strong style="color:#0a1628;">Email:</strong> <a href="mailto:${email}" style="color:#2563eb;text-decoration:none;">${email}</a></p>
                    <p style="margin:0 0 10px 0;"><strong style="color:#0a1628;">Phone:</strong> ${phoneNumber}</p>
                    <p style="margin:0 0 10px 0;"><strong style="color:#0a1628;">Date:</strong> ${dateDetails}</p>
                    <p style="margin:0;"><strong style="color:#0a1628;">Message:</strong><br>${message}</p>
                  </td>
                </tr>
              </table>
            </td>
          </tr>
          <tr>
            <td style="padding:20px 40px;background-color:#eef1f6;border-top:1px solid #e8ecf2;font-family:Arial,Helvetica,sans-serif;font-size:12px;line-height:1.5;color:#64748b;text-align:center;">
              <a href="${siteUrl}" style="color:#2563eb;text-decoration:none;">ytsenterprise.com</a>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
